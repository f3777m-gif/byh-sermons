<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c5a4b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>서영호 목사님 설교집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako_inflate.min.js"></script>
<style>
/* Layout: 한 줄 머리글 + 탭, 그 아래 한 칼럼(최대 46rem). 읽기 화면은 성경책 본문처럼 넓은 여백의 명조체. */
:root{
  --paper:#f5f6f2; --sheet:#fdfdfb; --ink:#1d2622; --muted:#5d6a63; --rule:#dfe3dc;
  --pine:#2c5a4b; --pine-soft:#e3ece7; --ribbon:#9a2f36; --mark:#f3e19a;
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fs:1.125rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141917; --sheet:#1a201d; --ink:#e4e9e5; --muted:#9aa8a0; --rule:#2c3531;
  --pine:#8cc4ae; --pine-soft:#22312b; --ribbon:#e0808a; --mark:#5c5220; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141917; --sheet:#1a201d; --ink:#e4e9e5; --muted:#9aa8a0; --rule:#2c3531;
  --pine:#8cc4ae; --pine-soft:#22312b; --ribbon:#e0808a; --mark:#5c5220; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:46rem;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:-16px;padding:14px 16px 0;border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em;cursor:pointer}
.brand .count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px}
nav.tabs a{padding:8px 14px;border-radius:8px 8px 0 0;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--pine);border-bottom-color:var(--pine)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,.row:focus-visible,.book:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
main{padding-top:20px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:28px 0 10px}
.eyebrow:first-child{margin-top:4px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.2rem,1fr));gap:8px}
.book{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:10px 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;color:var(--ink);text-decoration:none;min-width:0}
.book b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book span{color:var(--pine);font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:600}
.book.empty{opacity:.45;pointer-events:none;background:transparent}
.book.empty span{color:var(--muted);font-weight:400}
.book:hover{border-color:var(--pine)}
.pagehead{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.pagehead h2{font-family:var(--serif);font-size:1.6rem;margin:0;text-wrap:balance}
.pagehead p{margin:0;color:var(--muted)}
.back{background:none;border:0;color:var(--pine);font:inherit;font-weight:500;padding:4px 0;cursor:pointer;align-self:flex-start}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--sheet)}
.group{font-family:var(--serif);font-weight:600;color:var(--pine);margin:22px 0 6px;font-size:1.05rem;border-bottom:1px solid var(--rule);padding-bottom:4px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:6.4rem 1fr;gap:4px 14px;padding:11px 4px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);cursor:pointer}
.row:hover{background:var(--pine-soft)}
.row .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;padding-top:2px}
.row .d small{display:block;font-size:.8rem}
.row .m{min-width:0}
.row .p{font-weight:500}
.row .t{color:var(--muted);font-size:.92rem}
.row .snip{font-family:var(--serif);font-size:.95rem;color:var(--ink);margin-top:4px;line-height:1.7}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--rule);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);vertical-align:2px;font-weight:400}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:8px}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:11px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:0 18px;background:var(--pine);color:var(--sheet);cursor:pointer}
.hint{color:var(--muted);font-size:.9rem;margin:10px 0}
.progress{height:4px;background:var(--rule);border-radius:4px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--pine);width:0;transition:width .2s}
/* reader */
article.sermon{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:28px clamp(18px,5vw,48px) 40px;position:relative}
article.sermon::before{content:"";position:absolute;top:-1px;right:28px;width:14px;height:44px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.sermon .ref{font-family:var(--serif);font-size:1.55rem;font-weight:700;margin:0 0 6px;text-wrap:balance;padding-right:24px}
.sermon .meta{color:var(--muted);font-size:.92rem;display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.sermon .note{margin:14px 0 0;font-size:.85rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}
.sermon .body{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin-top:22px;word-break:keep-all;overflow-wrap:anywhere}
.sermon .body p{margin:0 0 .9em}
.sermon .body p.verse{font-size:.92em;color:var(--muted);margin:0 0 .3em;line-height:1.75}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sizes{display:flex;gap:4px}
.sizes button{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;width:40px;height:36px;cursor:pointer}
.sizes button:nth-child(1){font-size:.85rem}.sizes button:nth-child(3){font-size:1.15rem;font-weight:600}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tbtn{font:inherit;font-size:.88rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;min-height:36px;padding:0 10px;cursor:pointer}
.tbtn[aria-pressed="true"]{color:var(--ribbon);border-color:var(--ribbon)}
.hitnav{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--ink);font-variant-numeric:tabular-nums;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:6px;box-shadow:0 4px 14px rgb(0 0 0 / .14)}
.hitnav .tbtn{min-width:44px;min-height:44px;font-size:1.1rem}
.body mark.now{outline:2px solid var(--pine);outline-offset:1px}
.tactions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.tactions .btn{min-height:40px}
.tactions .tbtn{min-height:40px}
.addterm{font:inherit;font-size:.88rem;border:1px dashed var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;width:9rem;min-width:0}
.cnt{font-size:.78rem;color:var(--pine);font-weight:600;margin-top:2px}
.spark{width:100%;height:70px;display:block;margin:4px 0 8px}
.spark rect{fill:var(--pine)}
.spark text{fill:var(--muted);font-size:9px;font-family:var(--sans)}
.summary{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:12px 0;font-family:var(--serif);line-height:1.85;font-size:var(--fs)}
.summary h3{font-family:var(--sans);font-size:1rem;color:var(--pine);margin:18px 0 6px}
.summary h3:first-child{margin-top:4px}
.summary p{margin:6px 0}
.summary ul{margin:4px 0;padding-left:1.2em}
.summary li{margin:4px 0}
a.ref{font-family:var(--sans);font-size:.72rem;text-decoration:none;color:var(--pine);background:var(--pine-soft);border-radius:4px;padding:1px 5px;margin:0 1px;vertical-align:2px;font-weight:600}
.sumnote{font-family:var(--sans);font-size:.82rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:8px;margin-top:12px}
.mention{border-bottom:1px solid var(--rule);padding:10px 0}
.mtitle{font-weight:600;color:var(--ink);text-decoration:none}
.mtitle span{font-weight:400;color:var(--muted);font-size:.88rem;margin-left:6px}
.mention .snip{margin:6px 0 0}
a.jump{font-family:var(--sans);font-size:.8rem;color:var(--pine);white-space:nowrap}
.body p.flash{background:var(--pine-soft);border-radius:4px;box-shadow:0 0 0 6px var(--pine-soft)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.4rem,1fr));gap:6px;margin-bottom:8px}
.chb{display:flex;flex-direction:column;align-items:center;gap:0;padding:7px 2px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer;min-height:48px}
.chb b{font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.chb span{font-size:.72rem;color:var(--pine);font-variant-numeric:tabular-nums}
.chb:hover{border-color:var(--pine)}
.group,#chtop{scroll-margin-top:calc(var(--headh,110px) + 8px)}
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;font:inherit;font-weight:600;font-size:.92rem;background:var(--pine);color:var(--sheet);border:0;border-radius:999px;padding:12px 18px;box-shadow:0 4px 14px rgb(0 0 0 / .18);cursor:pointer}
.row.lastread{background:var(--pine-soft)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.pager button{flex:1;min-width:0;font:inherit;text-align:left;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
.pager button:last-child{text-align:right}
.pager button small{display:block;color:var(--muted);font-size:.8rem}
.pager button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager button:disabled{visibility:hidden}
.files{margin-top:26px;font-size:.8rem;color:var(--muted);word-break:break-all}
.loading{color:var(--muted);padding:30px 0}
@media (max-width:520px){nav.tabs{gap:0;justify-content:space-between}nav.tabs a{padding:10px 2px;flex:1 1 auto;text-align:center;font-size:.9rem;white-space:nowrap}.brand h1{font-size:1.25rem}.row{padding:13px 4px}.toolbar{align-items:flex-start}.row{grid-template-columns:1fr;gap:2px}.row .d small{display:inline;margin-left:6px}.sermon .ref{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1 id="home">서영호 목사님 설교집</h1><span class="count" id="count"></span></div>
    <nav class="tabs" aria-label="보기 방식">
      <a href="#bible" data-tab="bible">성경별</a>
      <a href="#years" data-tab="years">연도별</a>
      <a href="#search" data-tab="search">검색</a>
      <a href="#topic" data-tab="topic">주제</a>
      <a href="#fav" data-tab="fav">즐겨찾기</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view"><p class="loading">설교 목록을 불러오는 중입니다…</p></main>

<script>
const BOOKS=["창세기","출애굽기","레위기","민수기","신명기","여호수아","사사기","룻기","사무엘상","사무엘하","열왕기상","열왕기하","역대상","역대하","에스라","느헤미야","에스더","욥기","시편","잠언","전도서","아가","이사야","예레미야","예레미야애가","에스겔","다니엘","호세아","요엘","아모스","오바댜","요나","미가","나훔","하박국","스바냐","학개","스가랴","말라기","마태복음","마가복음","누가복음","요한복음","사도행전","로마서","고린도전서","고린도후서","갈라디아서","에베소서","빌립보서","골로새서","데살로니가전서","데살로니가후서","디모데전서","디모데후서","디도서","빌레몬서","히브리서","야고보서","베드로전서","베드로후서","요한일서","요한이서","요한삼서","유다서","요한계시록"];
const bookName=b=>b===99?"기타":BOOKS[b];
const $=s=>document.querySelector(s);
const view=$("#view");
let IDX=[],BYID=new Map(),TEXT={},ctx={ids:[],label:"",back:"bible"},lastQuery="",searchState={q:"",results:null};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const getList=k=>{try{return JSON.parse(store.get(k,"[]"))||[]}catch(e){return []}};
const setList=(k,v)=>store.set(k,JSON.stringify(v));
const SIZES=["1rem","1.125rem","1.3rem","1.5rem"];
let sizeIx=+store.get("fs",1); if(!(sizeIx>=0&&sizeIx<SIZES.length)) sizeIx=1;
document.documentElement.style.setProperty("--fs",SIZES[sizeIx]);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate=d=>{if(!d)return"날짜 미상";const[y,m,dd]=d.split("-");return `${y}. ${+m}. ${+dd}.`};
const fmtNum=n=>n.toLocaleString("ko-KR");

async function loadIndex(){
  const r=await fetch("index.json"); IDX=(await r.json()).map(a=>({id:a[0],date:a[1],svc:a[2],passage:a[3],book:a[4],ch:a[5],title:a[6],len:a[7],gap:a[8]}));
  IDX.forEach(s=>BYID.set(s.id,s));
  $("#count").textContent=`설교 ${fmtNum(IDX.length)}편`;
}
const DBV="sy-v3";
function idb(mode,fn){return new Promise(res=>{try{const r=indexedDB.open("sermon-seo",1);r.onupgradeneeded=()=>r.result.createObjectStore("c");r.onsuccess=()=>{try{const tx=r.result.transaction("c",mode);const q=fn(tx.objectStore("c"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}})}
const bookPromises={};
function loadBook(b){
  if(TEXT[b]) return Promise.resolve(TEXT[b]);
  if(!bookPromises[b]) bookPromises[b]=fetchBook(b).catch(e=>{delete bookPromises[b];throw e});
  return bookPromises[b];
}
async function fetchBook(b){
  const key=DBV+"-b"+b;
  let buf=await idb("readonly",st=>st.get(key));
  if(!buf){const r=await fetch(`t/b${b}.bin`); if(!r.ok) throw new Error("load"); buf=await r.arrayBuffer(); idb("readwrite",st=>st.put(buf,key));}
  const u8=new Uint8Array(buf);
  let txt; if(u8[0]===0x1f&&u8[1]===0x8b){ if("DecompressionStream" in window){ txt=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); } else txt=pako.ungzip(u8,{to:"string"}); } else txt=new TextDecoder().decode(u8);
  TEXT[b]=JSON.parse(txt); return TEXT[b];
}
function setTab(t){store.set("sy-tab",t);document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
function go(h){ if(location.hash==="#"+h) route(); else location.hash=h; }

function rowHTML(s,extra=""){
  const tag=s.gap?`<span class="tag">일부 생략</span>`:"";
  return `<a class="row" href="#s${s.id}" data-id="${s.id}"><div class="d">${fmtDate(s.date)}<small>${esc(s.svc||"")}</small></div><div class="m"><div class="p">${esc(s.passage||bookName(s.book))}${tag}</div>${s.title?`<div class="t">${esc(s.title)}</div>`:""}${extra}</div></a>`;
}

function viewBible(){
  setTab("bible");
  const cnt={}; IDX.forEach(s=>cnt[s.book]=(cnt[s.book]||0)+1);
  const cell=b=>`<a class="book ${cnt[b]?"":"empty"}" href="#b${b}"><b>${bookName(b)}</b><span>${cnt[b]||0}</span></a>`;
  let h=`<div class="eyebrow">구약 39권</div><div class="books">${BOOKS.slice(0,39).map((_,i)=>cell(i)).join("")}</div>`;
  h+=`<div class="eyebrow">신약 27권</div><div class="books">${BOOKS.slice(39).map((_,i)=>cell(i+39)).join("")}</div>`;
  if(cnt[99]) h+=`<div class="eyebrow">그 밖의 설교</div><div class="books">${cell(99)}</div>`;
  view.innerHTML=h;
}
let bookFilter="전체";
function viewBook(b,keepFilter){
  setTab("bible");
  if(!keepFilter) bookFilter="전체";
  const all=IDX.filter(s=>s.book===b).sort((x,y)=>(x.ch-y.ch)||(x.date||"9").localeCompare(y.date||"9")||x.id-y.id);
  const svcs=["전체",...["주일 오전","주일 오후","수요 예배","금요 예배"].filter(v=>all.some(s=>s.svc===v)), ...(all.some(s=>/새벽/.test(s.svc))?["새벽"]:[])];
  const list=all.filter(s=>bookFilter==="전체"||(bookFilter==="새벽"?/새벽/.test(s.svc):s.svc===bookFilter));
  ctx={ids:list.map(s=>s.id),label:bookName(b),back:"b"+b};
  let h=`<div class="pagehead"><button class="back" data-go="bible">← 성경 목록</button><h2>${bookName(b)}</h2><p>설교 ${fmtNum(all.length)}편 · 장 순서, 같은 장은 날짜 순</p></div>`;
  h+=`<div class="filters" role="group" aria-label="예배 구분">${svcs.map(v=>`<button class="chip" data-f="${v}" aria-pressed="${v===bookFilter}">${v}</button>`).join("")}</div>`;
  const unit=b===18?"편":"장", chc={};
  list.forEach(s=>{const k=s.ch||0; chc[k]=(chc[k]||0)+1});
  const chs=Object.keys(chc).map(Number).sort((x,y)=>(x||9999)-(y||9999));
  if(chs.length>1) h+=`<div class="eyebrow" id="chtop">${unit} 바로 가기</div><div class="chgrid">${chs.map(c=>`<button class="chb" data-ch="${c}"><b>${c||"?"}</b><span>${chc[c]}</span></button>`).join("")}</div>`;
  let cur=null;
  for(const s of list){ const k=s.ch||0, g=k?`${k}${unit}`:"장 미상"; if(g!==cur){ if(cur!==null) h+="</div>"; h+=`<div class="group" id="ch-${k}">${g}</div><div class="list">`; cur=g;} h+=rowHTML(s); }

  drawTerms(); $("#tres").innerHTML=`<p class="hint">설교 원문을 준비하고 있습니다. 처음 한 번은 약 21MB를 받습니다.</p>`;
  const ai=suggestTerms(q);
  const pg=$("#tpg"); try{ await ensureAll(p=>{ if(pg){pg.hidden=false; pg.querySelector("i").style.width=(p*100)+"%"} }); }catch(e){ $("#tres").innerHTML=`<p class="hint">설교 원문을 받지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.</p>`; return; }
  if(pg) pg.hidden=true;
  cooccur(base).forEach(t=>{ if(!hasTerm(t)){ topicState.terms.push(t); topicState.on[t]=false; } });
  drawTerms(); runTopic();
  const s=await ai; topicState.busy=false;
  if(topicState.q!==q) return;
  let added=false; (s||[]).forEach(t=>{ t=t.trim(); if(t&&!hasTerm(t)){ topicState.terms.splice(base.length,0,t); topicState.on[t]=true; added=true; } });
  drawTerms(); if(added) runTopic();
}
function drawTerms(){
  const el=$("#tterms"); if(!el) return;
  el.innerHTML=`<div class="eyebrow">검색어 ${topicState.busy&&SAMPLE?"· 관련 표현을 더 찾는 중…":"· 눌러서 켜고 끄기"}</div><div class="filters">${topicState.terms.map(t=>`<button class="chip" data-t="${esc(t)}" aria-pressed="${!!topicState.on[t]}">${esc(t)}</button>`).join("")}<input class="addterm" id="addt" placeholder="+ 검색어 추가" aria-label="검색어 추가"></div>`;
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const t=b.dataset.t; topicState.on[t]=!topicState.on[t]; drawTerms(); runTopic();});
  $("#addt").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); const t=e.target.value.trim(); if(t&&!hasTerm(t)){ topicState.terms.push(t); topicState.on[t]=true; drawTerms(); runTopic(); } } };
}
function runTopic(){
  const terms=topicState.terms.filter(t=>topicState.on[t]);
  if(!terms.length){ topicState.res=null; $("#tres").innerHTML=`<p class="hint">켜진 검색어가 없습니다.</p>`; return; }
  const base=splitTerms(topicState.q);
  topicState.active=terms; topicState.summary=""; topicState.passages=[];
  topicState.res=topicSearch(terms,terms.map(t=>base.includes(t)?3:1));
  drawTopic();
}
function topicCtx(ids){ const terms=topicState.active; ctx={ids,label:`"${topicState.q}" 주제 탐구`,back:"topic",hlFn:h=>hlRe(h,terms)}; }
function yearBars(res){
  const ys={}; res.forEach(r=>{ if(r.s.date){const y=+r.s.date.slice(0,4); ys[y]=(ys[y]||0)+1} });
  const all=IDX.filter(s=>s.date).map(s=>+s.date.slice(0,4)); const y0=Math.min(...all), y1=Math.max(...all);
  const Y=[]; for(let y=y0;y<=y1;y++) Y.push(y);
  const mx=Math.max(1,...Y.map(y=>ys[y]||0)), W=Y.length*16;
  return `<svg class="spark" viewBox="0 0 ${W} 70" preserveAspectRatio="none" role="img" aria-label="연도별 설교 수">${Y.map((y,k)=>{const h=Math.round((ys[y]||0)/mx*44);return `<rect x="${k*16+2}" y="${52-h}" width="12" height="${Math.max(h,1)}"><title>${y}년 ${ys[y]||0}편</title></rect>${y%5===0?`<text x="${k*16+8}" y="66" text-anchor="middle">${String(y).slice(2)}</text>`:""}`}).join("")}</svg>`;
}
function drawTopic(){
  const res=topicState.res, terms=topicState.active; if(!res||!$("#tres")) return;
  topicCtx(res.map(r=>r.s.id));
  const tot=res.reduce((a,r)=>a+r.total,0);
  let h=`<p class="hint"><b>${fmtNum(res.length)}편</b>의 설교에서 ${fmtNum(tot)}곳 언급 · 연도별 분포</p>${res.length?yearBars(res):""}
  <div class="tactions">${SAMPLE?`<button class="btn" id="summ">가르침 정리하기</button>`:""}<button class="tbtn" id="ment">언급 대목 모아 보기</button>${DL?`<button class="tbtn" id="save">자료집으로 저장</button>`:""}</div>
  ${SAMPLE?"":`<p class="hint">이 화면에서는 Claude 정리 기능을 쓸 수 없어 추천 설교와 언급 대목만 보여 드립니다.</p>`}
  <div id="summout"></div><div class="eyebrow">추천 설교 · 이 주제를 많이 다룬 순</div><div class="list">`;
  h+=res.slice(0,40).map(r=>{const t=textOf(r.s); const tags=r.counts.map((c,k)=>c?`${esc(terms[k])} ${c}`:"").filter(Boolean).join(" · ");
    return rowHTML(r.s,`<div class="cnt">${tags}</div>`+bestWindows(r,1,110).map(p=>`<div class="snip">${hlRe(esc(cutAround(t,p[0],p[1],110)),terms)}</div>`).join(""))}).join("");
  h+=`</div>${res.length>40?`<p class="hint">나머지 ${fmtNum(res.length-40)}편은 "언급 대목 모아 보기"에서 볼 수 있습니다.</p>`:""}`;
  $("#tres").innerHTML=h;
  $("#ment").onclick=drawMentions;
  if($("#summ")) $("#summ").onclick=summarize;
  if($("#save")) $("#save").onclick=saveDossier;
  if(topicState.summary) showSummary(topicState.summary,true);
}
function drawMentions(){
  const terms=topicState.active, r=topicState.res.slice().sort((a,b)=>(a.s.date||"").localeCompare(b.s.date||""));
  let h=`<div class="eyebrow">언급 대목 · 날짜순 ${fmtNum(r.length)}편</div>`;
  h+=r.slice(0,250).map(x=>{const t=textOf(x.s); return `<div class="mention"><a class="mtitle" href="#s${x.s.id}">${esc(x.s.passage||bookName(x.s.book))} <span>${fmtDate(x.s.date)} ${esc(x.s.svc||"")}</span></a>${bestWindows(x,3,150).map(p=>`<p class="snip">${hlRe(esc(cutAround(t,p[0],p[1],150)),terms)} <a href="#s${x.s.id}" class="jump" data-open="${x.s.id}" data-at="${p[0]}">원문 위치로</a></p>`).join("")}</div>`}).join("");
  if(r.length>250) h+=`<p class="hint">250편까지만 보여 드립니다. 검색어를 끄거나 바꿔서 좁혀 보세요.</p>`;
  $("#summout").innerHTML=h; $("#summout").scrollIntoView({block:"start"});
}
function collectPassages(maxS,perS,w){
  const P=[]; topicState.res.slice(0,maxS).forEach(x=>{const t=textOf(x.s); bestWindows(x,perS,w).forEach(p=>P.push({id:x.s.id,at:p[0],text:cutAround(t,p[0],p[1],w)}))});
  return P;
}
async function summarize(){
  if(!SAMPLE) return;
  const P=collectPassages(28,2,260); topicState.passages=P;
  const src=P.map((p,k)=>{const s=BYID.get(p.id); return `[${k+1}] ${s.passage||bookName(s.book)} / ${fmtDate(s.date)} ${s.svc||""}${s.title?" / "+s.title:""}\n${p.text}`}).join("\n\n");
  const prompt=`다음은 서영호 목사님의 설교 녹취 원고에서 '${topicState.q}'에 관한 대목을 검색해 뽑은 원문 ${P.length}개입니다. 말씀을 받아 적은 원고라 구어체이고, 알아듣기 어려운 곳은 "..."로 남아 있습니다.

${src}

위 원문만 근거로, 서영호 목사님이 '${topicState.q}'에 대해 가르친 내용을 주제별로 정리하세요.
규칙:
- 한국어, 평서체. 맨 앞에 2문장 요약을 쓰고, 이어서 3~6개의 소주제(### 제목)로 나누어 각 소주제마다 요점을 2~5개 bullet(- )로 쓰세요.
- 모든 요점 끝에 근거 원문 번호를 [3], [5][12]처럼 붙이세요. 원문에 없는 내용, 일반 신학 지식, 다른 목회자의 견해는 넣지 마세요.
- 핵심 표현은 원문 그대로 짧게 따옴표로 인용하세요(글자를 바꾸지 말 것).
- 목사님의 가르침을 존중하는 관점에서 설명하고 비판하거나 평가하지 마세요.
- 맨 끝에 '### 더 읽을 설교' 아래 3편을 원문 번호와 함께 추천하세요.`;
  if(summCtl) summCtl.abort(); summCtl=new AbortController();
  const out=$("#summout");
  out.innerHTML=`<div class="summary"><p class="hint">설교 원문 ${P.length}곳을 읽고 정리하는 중입니다… 보통 20~60초 걸립니다. <button class="tbtn" id="stop">그만</button></p></div>`;
  $("#stop").onclick=()=>summCtl&&summCtl.abort();
  try{
    const r=await SAMPLE(prompt,{modelTier:"default",signal:summCtl.signal,onText:u=>showSummary(u.text,false)});
    topicState.summary=r.text; showSummary(r.text,true);
  }catch(e){
    if(e&&e.code==="cancelled"){ if(e.text){topicState.summary=e.text; showSummary(e.text,true)} else out.innerHTML=""; return; }
    const msg=e&&e.code==="not_granted"?"Claude 사용을 허락하지 않아 정리할 수 없습니다.":e&&e.code==="rate_limited"?"요청이 많습니다. 잠시 뒤에 다시 눌러 주세요.":"정리하지 못했습니다. 잠시 뒤에 다시 눌러 주세요.";
    if(e&&e.text){ topicState.summary=e.text; showSummary(e.text,true); }
    else out.innerHTML="";
    out.insertAdjacentHTML("beforeend",`<p class="hint">${msg}</p>`);
    if(e&&e.code==="not_granted"){ SAMPLE=null; const b=$("#summ"); if(b) b.remove(); }
  }
}
function mdLite(s){
  const inl=x=>esc(x).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[(\d+)\]/g,(m,n)=>{const p=topicState.passages[+n-1]; if(!p) return m; const o=BYID.get(p.id); return `<a href="#s${p.id}" class="ref" data-open="${p.id}" data-at="${p.at}" title="${esc((o.passage||"")+" · "+fmtDate(o.date))}">${n}</a>`});
  let h="",ul=false;
  s.split("\n").forEach(l=>{const t=l.trim();
    if(/^#{1,4}\s/.test(t)){ if(ul){h+="</ul>";ul=false} h+=`<h3>${inl(t.replace(/^#+\s*/,""))}</h3>`; }
    else if(/^([-*•]|\d+[.)])\s/.test(t)){ if(!ul){h+="<ul>";ul=true} h+=`<li>${inl(t.replace(/^[-*•]\s/,""))}</li>`; }
    else if(t){ if(ul){h+="</ul>";ul=false} h+=`<p>${inl(t)}</p>`; } });
  if(ul) h+="</ul>"; return h;
}
function showSummary(text,done){ const out=$("#summout"); if(!out) return;
  out.innerHTML=`<div class="summary">${mdLite(text)}${done?`<p class="sumnote">번호를 누르면 근거가 된 설교의 그 대목으로 갑니다. Claude가 설교 원문 ${topicState.passages.length}곳을 읽고 정리한 것이므로, 중요한 내용은 원문으로 꼭 확인하세요.</p>`:""}</div>`; }
const citation=s=>`서영호 목사 설교, ${s.passage||bookName(s.book)}, ${fmtDate(s.date)}${s.svc?" "+s.svc:""}${s.title?" 「"+s.title+"」":""}`;
async function saveDossier(){
  if(!DL) return;
  const terms=topicState.active, q=topicState.q, fn=[]; let c=0;
  let md=`# 서영호 목사님 설교에 나타난 '${q}'\n\n검색어: ${terms.join(", ")} · 관련 설교 ${topicState.res.length}편\n\n`;
  if(topicState.summary){ md+=`## 정리 (Claude가 설교 원문 ${topicState.passages.length}곳을 근거로 정리)\n\n`+topicState.summary.replace(/\[(\d+)\]/g,(m,n)=>topicState.passages[+n-1]?`[^${n}]`:m)+"\n\n"; topicState.passages.forEach((p,k)=>fn.push(`[^${k+1}]: ${citation(BYID.get(p.id))}`)); c=fn.length; }
  md+="## 언급 대목 (관련도 순)\n\n";
  topicState.res.slice(0,120).forEach(x=>{const t=textOf(x.s); md+=`### ${x.s.passage||bookName(x.s.book)} (${fmtDate(x.s.date)})\n\n`; bestWindows(x,3,160).forEach(p=>{c++; md+=`> ${cutAround(t,p[0],p[1],180)}[^${c}]\n\n`; fn.push(`[^${c}]: ${citation(x.s)}`)})});
  md+="\n---\n\n"+fn.join("\n\n")+"\n";
  try{ await DL.save({filename:`서영호목사_설교_${q.replace(/[\\/:*?"<>|\s]+/g,"_")}.md`,data:md}); }
  catch(e){ if(e&&e.code==="unavailable"){ DL=null; const b=$("#save"); if(b) b.remove(); } }
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("s")&&/^\d+$/.test(h.slice(1))) return viewSermon(+h.slice(1));
  window.scrollTo(0,0);
  if(h.startsWith("b")&&/^\d+$/.test(h.slice(1))) return viewBook(+h.slice(1));
  if(h==="years") return viewYears();
  if(h.startsWith("y")&&/^\d+$/.test(h.slice(1))) return viewYear(h.slice(1));
  if(h==="search") return viewSearch();
  if(h==="fav") return viewFav();
  if(h==="topic") return viewTopic();
  return viewBible();
}
view.addEventListener("click",e=>{const o=e.target.closest("[data-open]"); if(o){e.preventDefault(); pendingAt={id:+o.dataset.open,at:o.dataset.at!=null?+o.dataset.at:null}; go("s"+o.dataset.open); return;} const b=e.target.closest("[data-go]"); if(b){e.preventDefault();go(b.dataset.go)}});
$("#home").onclick=()=>go("bible");
window.addEventListener("hashchange",route);
if(window.claude&&window.claude.use){
  window.claude.use("sample").then(s=>{SAMPLE=s; if(location.hash==="#topic"&&s) viewTopic();}).catch(()=>{});
  window.claude.use("downloads").then(d=>{DL=d; if(location.hash==="#topic"&&topicState.res&&d) drawTopic();}).catch(()=>{});
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
loadIndex().then(()=>{ if(!location.hash){const t=store.get("sy-tab",""); if(["years","search","topic","fav"].includes(t)) location.hash=t;} route(); }).catch(()=>{view.innerHTML=`<p class="hint">설교 목록을 불러오지 못했습니다. 새로 고침해 주세요.</p>`});
</script>
