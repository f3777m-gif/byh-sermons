}

  --paper:#141716; --sheet:#1b1f1e; --ink:#e4e7e3; --soft:#a5ada9; --faint:#7a827e;
  --rule:#2f3533; --accent:#6fb8a9; --accent-ink:#0f1614; --accent-soft:#213330;

  --mark:#6b5a17; --mark-ink:#fff7d6; --warn:#e2a46b; color-scheme:dark}
*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.note{font-size:.8rem;color:var(--warn)}
.empty{color:var(--faint);font-size:.88rem;padding:1rem 0}
/* reader */

.rhead .eb{font-size:.78rem;color:var(--accent);letter-spacing:.04em;font-weight:600}
.rhead h1{font-family:var(--serif);font-size:1.8rem;line-height:1.3;margin:.3rem 0 .4rem;text-wrap:balance}

.rtools{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}

.rbody{max-width:40em;margin:1rem auto 0;font-family:var(--serif);font-size:var(--fs,1.06rem);line-height:1.95}
.rbody p{margin:0 0 1em}
.rbody mark.now{outline:2px solid var(--accent)}
.related{max-width:40em;margin:2rem auto 0;border-top:1px solid var(--rule);padding-top:.8rem}
.welcome{max-width:36em;margin:2rem auto;font-family:var(--serif)}
.welcome h1{font-size:2rem;margin:.2rem 0 .6rem}
.welcome p{color:var(--soft);line-height:1.8}

.welcome dd{margin:0;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.welcome ol{padding-left:1.2rem;color:var(--soft);font-family:var(--sans);font-size:.9rem;line-height:1.8}
.back{display:none}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.45rem .9rem;border-radius:6px;font-size:.85rem;z-index:50}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}

  body.reading .work{display:none}

  .back{display:inline-block}
  .loadstat{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

<script>
(function(){
"use strict";

var ABBR=["창","출","레","민","신","수","삿","룻","삼상","삼하","왕상","왕하","대상","대하","스","느","에","욥","시","잠","전","아","사","렘","애","겔","단","호","욜","암","옵","욘","미","나","합","습","학","슥","말","마","막","눅","요","행","롬","고전","고후","갈","엡","빌","골","살전","살후","딤전","딤후","딛","몬","히","약","벧전","벧후","요일","요이","요삼","유","계"];
var DAYS="일월화수목금토";
var RENDER={};
var IDX=[], CHUNKS=[], TEXT={}, CHUNK_OF=[], loadingAll=null, NCH=15;
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var state={tab:"topic",cur:null,hl:[],hit:0};
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2200)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ---------- formatting ---------- */
function fmtDate(o){if(!o.d)return "날짜 미상";return o.d.slice(0,4)+". "+(+o.d.slice(4,6))+". "+(+o.d.slice(6,8))+". ("+(o.w||"")+")"}
function fmtRef(o,short){if(o.b<0)return "";var b=short?ABBR[o.b]:BOOKS[o.b];if(!o.c)return b;var s=b+" "+o.c+(o.v?":"+o.v:"");if(o.c2!==o.c)s+="–"+o.c2+":"+o.v2;else if(o.v2&&o.v2!==o.v)s+="–"+o.v2;return s}
function line2(o){return [fmtRef(o,true),fmtDate(o),o.s].filter(Boolean).join(" · ")}
function citation(o){return "백영희, 「"+o.t+"」, "+fmtRef(o)+", "+(o.d?o.d.slice(0,4)+". "+(+o.d.slice(4,6))+". "+(+o.d.slice(6,8))+". "+(o.w?o.w+"요일":"")+(o.s?" "+o.s:""):"날짜 미상")+". ("+o.f+")"}

/* ---------- data loading ---------- */
function setLoad(txt,p){$("#loadtxt").textContent=txt;$("#loadbar").style.width=Math.round((p||0)*100)+"%"}
async function idbGet(k){try{return await new Promise(function(res){var r=indexedDB.open("byh-sermons",1);r.onupgradeneeded=function(){r.result.createObjectStore("c")};r.onsuccess=function(){try{var g=r.result.transaction("c").objectStore("c").get(k);g.onsuccess=function(){res(g.result||null)};g.onerror=function(){res(null)}}catch(e){res(null)}};r.onerror=function(){res(null)}})}catch(e){return null}}
async function idbPut(k,v){try{await new Promise(function(res){var r=indexedDB.open("byh-sermons",1);r.onupgradeneeded=function(){r.result.createObjectStore("c")};r.onsuccess=function(){try{var tx=r.result.transaction("c","readwrite");tx.objectStore("c").put(v,k);tx.oncomplete=res;tx.onerror=res}catch(e){res()}};r.onerror=res})}catch(e){}}
async function gunzipToText(buf){var u=new Uint8Array(buf);if(u[0]===0x1f&&u[1]===0x8b&&"DecompressionStream" in window){var s=new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));return await new Response(s).text()}return new TextDecoder().decode(buf)}
var chunkPromises={};
function loadChunk(k){
  if(chunkPromises[k])return chunkPromises[k];
  chunkPromises[k]=(async function(){
    var key="v1-c"+k, buf=await idbGet(key);
    if(!buf){var r=await fetch("data/c"+String(k).padStart(2,"0")+".bin");if(!r.ok)throw new Error("자료 파일을 받지 못했습니다 ("+r.status+")");buf=await r.arrayBuffer();idbPut(key,buf)}
    var arr=JSON.parse(await gunzipToText(buf));var st=CHUNKS[k][0];
    for(var i=0;i<arr.length;i++)TEXT[st+i]=arr[i];
    return true})();
  chunkPromises[k].catch(function(){delete chunkPromises[k]});
  return chunkPromises[k];
}
function loadAll(){
  if(loadingAll)return loadingAll;
  var done=0;setLoad("전체 원문 준비 중 0/"+NCH,0);
  loadingAll=Promise.all(CHUNKS.map(function(_,k){return loadChunk(k).then(function(){done++;setLoad(done<NCH?"전체 원문 준비 중 "+done+"/"+NCH:"전체 원문 준비 완료",done/NCH)})})).catch(function(e){loadingAll=null;setLoad("원문을 받지 못했습니다. 다시 검색하면 이어서 받습니다.",0);throw e});
  return loadingAll;
}
async function getText(i){if(TEXT[i]===undefined)await loadChunk(IDX[i].k);return TEXT[i]}

/* ---------- search core ---------- */
function termRe(t){t=t.replace(/\s+/g,"");var parts=Array.from(t).map(function(c){return c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")});return parts.join("\\s*")}
function buildRe(terms){return new RegExp(terms.map(function(t){return "("+termRe(t)+")"}).join("|"),"g")}
function filterOK(o,f){if(!f)return true;if(f.book!==""&&f.book!=null&&o.b!==+f.book)return false;var y=o.d?+o.d.slice(0,4):0;if(f.y1&&(!y||y<+f.y1))return false;if(f.y2&&(!y||y>+f.y2))return false;if(f.sv&&o.s.indexOf(f.sv)<0)return false;if(f.testament==="ot"&&!(o.b>=0&&o.b<39))return false;if(f.testament==="nt"&&!(o.b>=39))return false;return true}
/* returns [{i,counts[],total,pos:[[start,end,termIdx]]}] */
function runSearch(terms,f,needAll){
  var re=buildRe(terms),out=[];
  for(var i=0;i<IDX.length;i++){
    var o=IDX[i];if(!filterOK(o,f))continue;var t=TEXT[i];if(!t)continue;
    re.lastIndex=0;var m,counts=terms.map(function(){return 0}),pos=[];
    while((m=re.exec(t))){var ti=0;for(var g=1;g<m.length;g++)if(m[g]!==undefined){ti=g-1;break}counts[ti]++;if(pos.length<400)pos.push([m.index,m.index+m[0].length,ti]);if(m[0].length===0)re.lastIndex++}
    var tot=counts.reduce(function(a,b){return a+b},0);
    if(!tot)continue;
    if(needAll&&counts.some(function(c){return !c}))continue;
    out.push({i:i,counts:counts,total:tot,pos:pos});
  }
  return out;
}
function snippetAt(t,s,e,w){w=w||70;var a=Math.max(0,s-w),b=Math.min(t.length,e+w);while(a>0&&a>s-w-12&&!/[\s.?!]/.test(t[a-1]))a--;return (a>0?"…":"")+t.slice(a,b).replace(/\n/g," ")+(b<t.length?"…":"")}
function hlHTML(s,terms){var re=buildRe(terms);var out="",last=0,m;re.lastIndex=0;while((m=re.exec(s))){out+=esc(s.slice(last,m.index))+"<mark>"+esc(m[0])+"</mark>";last=m.index+m[0].length;if(!m[0].length)re.lastIndex++}return out+esc(s.slice(last))}
/* pick up to n windows spread across a sermon, densest first */
function bestWindows(r,t,n,w){
  var ps=r.pos.slice(),wins=[];
  ps.forEach(function(p){var c=0,ds={};r.pos.forEach(function(q){if(Math.abs(q[0]-p[0])<w){c++;ds[q[2]]=1}});p.score=c+Object.keys(ds).length*2});
  ps.sort(function(a,b){return b.score-a.score});
  for(var k=0;k<ps.length&&wins.length<n;k++){var p=ps[k];if(wins.some(function(x){return Math.abs(x[0]-p[0])<w*2}))continue;wins.push([p[0],p[1]])}
  return wins.sort(function(a,b){return a[0]-b[0]});
